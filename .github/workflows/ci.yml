name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    services:
      # The integration tests exercise real transaction and constraint
      # behaviour - lost updates, unique violations, CHECK enforcement - none of
      # which a mocked client can demonstrate. They skip themselves when
      # DATABASE_URL is unset, so without this container the suite would pass
      # while silently testing far less.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: businessos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/businessos_test?schema=public
      # Values the schema in src/lib/env.ts requires at import time. None are
      # real: nothing in CI sends mail or signs a production session.
      AUTH_SECRET: ci-secret-value-that-is-long-enough-to-pass-validation
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: BusinessOS <ci@example.test>

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        # Also proves the migrations apply cleanly from empty, which the
        # hand-written ones in this repo make worth checking on every change.
        run: npm run db:deploy

      - name: Check for schema drift
        # Fails if schema.prisma and the migration history disagree.
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  migrate:
    name: Apply migrations to production
    # Only after everything above is green, and only for main. Pull requests
    # and preview builds never reach this job, which is the failure the old
    # setup had: `prisma migrate deploy` inside `npm run build` ran in every
    # build container, on previews as well as production, before any deploy
    # gate, and with no way back - Vercel's instant rollback reverts code only.
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Deliberately NOT bound to a GitHub environment. Vercel's GitHub
    # integration manages its own "Production" environment, and binding this job
    # to one of the same name would entangle the two. PRODUCTION_DATABASE_URL is
    # a repository secret, which is available here without an environment.

    # One migration run at a time, never cancelled part-way through.
    concurrency:
      group: migrate-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show pending migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate status

      - name: Apply migrations
        env:
          # Neon's DIRECT (non-pooled) connection string. Migrations need a real
          # session, which a pooled connection cannot guarantee.
          MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run db:deploy

  deploy:
    name: Deploy to Vercel
    # The ordering this whole workflow exists for: verify, then migrate, then
    # ship. A failed migration stops the deploy, so code that needs a schema
    # change is never live before that change lands.
    #
    # Vercel's own git auto-deploy is disabled for main in vercel.json, because
    # it does not wait for anything. Pull requests still get preview deploys.
    needs: [verify, migrate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check deploy credentials are configured
        # Fails here with a readable message rather than deep inside the Vercel
        # CLI. Auto-deploy is off for main (vercel.json), so a missing secret
        # means nothing ships at all - worth saying plainly.
        run: |
          missing=""
          [ -n "${{ secrets.VERCEL_TOKEN }}" ]      || missing="$missing VERCEL_TOKEN"
          [ -n "${{ secrets.VERCEL_ORG_ID }}" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Production deploys run from this workflow because vercel.json"
            echo "disables Vercel's own auto-deploy for main. Until these secrets"
            echo "exist, nothing is deployed."
            echo ""
            echo "Add them at Settings > Secrets and variables > Actions."
            echo "  VERCEL_TOKEN       Vercel > Account Settings > Tokens"
            echo "  VERCEL_ORG_ID      orgId in .vercel/repo.json after 'vercel link'"
            echo "  VERCEL_PROJECT_ID  id in the same file"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link the project
        # Written explicitly rather than via `vercel link`, which needs
        # interactive input, and rather than relying on VERCEL_ORG_ID /
        # VERCEL_PROJECT_ID being picked up implicitly - a project-scoped token
        # cannot always read the settings endpoint those depend on.
        env:
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJ: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Trim any stray whitespace a paste may have introduced; an id with a
          # trailing newline fails the lookup with no useful message.
          ORG="$(printf %s "$ORG" | tr -d '[:space:]')"
          PROJ="$(printf %s "$PROJ" | tr -d '[:space:]')"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$ORG" "$PROJ" > .vercel/project.json
          echo "linked orgId=${ORG:0:5}... projectId=${PROJ:0:4}... (lengths ${#ORG}/${#PROJ})"

      - name: Deploy
        # Vercel builds this server-side, using the environment variables
        # configured on the project - the same thing git auto-deploy did, only
        # now it happens after migrations rather than racing them.
        #
        # Deliberately not `vercel pull` + `vercel build` + `--prebuilt`:
        # building here would be faster, but pulling requires read access to
        # project settings, which a narrowly-scoped deploy token does not have.
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

# Setup this workflow expects:
#
#   PRODUCTION_DATABASE_URL - Neon's DIRECT (non-pooled) connection string.
#   VERCEL_TOKEN            - Vercel account token.
#   VERCEL_ORG_ID           - from `vercel link`, in .vercel/project.json.
#   VERCEL_PROJECT_ID       - likewise.
#
# All four are repository secrets. No GitHub environment is used, so nothing
# here collides with the "Production" environment Vercel's integration manages.
#
# Ordering: verify -> migrate -> deploy, each gated on the last. Migrations
# should still be expand-then-contract where possible, since a deploy is never
# instantaneous; but a rename like harden_ledger, which is not backward
# compatible in either direction, is now at least guaranteed to land before the
# code that expects it.
