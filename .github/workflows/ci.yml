name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    services:
      # The integration tests exercise real transaction and constraint
      # behaviour - lost updates, unique violations, CHECK enforcement - none of
      # which a mocked client can demonstrate. They skip themselves when
      # DATABASE_URL is unset, so without this container the suite would pass
      # while silently testing far less.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: businessos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/businessos_test?schema=public
      # Values the schema in src/lib/env.ts requires at import time. None are
      # real: nothing in CI sends mail or signs a production session.
      AUTH_SECRET: ci-secret-value-that-is-long-enough-to-pass-validation
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: BusinessOS <ci@example.test>

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        # Also proves the migrations apply cleanly from empty, which the
        # hand-written ones in this repo make worth checking on every change.
        run: npm run db:deploy

      - name: Check for schema drift
        # Fails if schema.prisma and the migration history disagree.
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  migrate:
    name: Apply migrations to production
    # Only after everything above is green, and only for main. Pull requests
    # and preview builds never reach this job, which is the failure the old
    # setup had: `prisma migrate deploy` inside `npm run build` ran in every
    # build container, on previews as well as production, before any deploy
    # gate, and with no way back - Vercel's instant rollback reverts code only.
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # Deliberately NOT bound to a GitHub environment. Vercel's GitHub
    # integration manages its own "Production" environment, and binding this job
    # to one of the same name would entangle the two. PRODUCTION_DATABASE_URL is
    # a repository secret, which is available here without an environment.

    # One migration run at a time, never cancelled part-way through.
    concurrency:
      group: migrate-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show pending migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate status

      - name: Apply migrations
        env:
          # Neon's DIRECT (non-pooled) connection string. Migrations need a real
          # session, which a pooled connection cannot guarantee.
          MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run db:deploy

# Setup this workflow expects:
#
#   A repository secret PRODUCTION_DATABASE_URL, set to the Neon DIRECT
#   (non-pooled) connection string. Nothing else - no GitHub environment, so
#   this does not collide with the one Vercel's integration manages.
#
# Ordering caveat: Vercel deploys on the same push this job runs on, so code and
# schema change at roughly the same moment without a strict order between them.
# Keep migrations expand-then-contract - add before you remove, and let one
# deploy pass between the two - so old and new code can both run against the
# intermediate schema. The harden_ledger migration on this branch is the
# counter-example: it renames a column and an enum value in place, so it is not
# backward compatible and wants a quiet moment to land.
